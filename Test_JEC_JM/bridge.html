<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex, nofollow">
  <title>Test JEC JM — redirection</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0a0a12;
      color: #e8e8f0;
    }
  </style>
</head>
<body>
  <p>Redirection…</p>
  <script type="module">
    import {
      readPendingLocalPayload,
      clearPendingLocalPayload,
      resolveBridgeTarget,
      parseIncomingLink,
      normalizeBridgeTarget,
      markMauriceAccessGranted,
    } from '../js/powerapps-bridge.js';

    const params = new URLSearchParams(location.search);
    const fromStore2 = params.get('from') === 'store2';
    let payload = readPendingLocalPayload();

    if (!fromStore2 && !payload) {
      location.replace('index.html');
    } else {
      if (!payload) {
        payload = parseIncomingLink(location.search);
      }
      const target = normalizeBridgeTarget(resolveBridgeTarget(payload));
      markMauriceAccessGranted();
      clearPendingLocalPayload();
      location.replace(new URL('../' + target, location.href).href);
    }
  </script>
</body>
</html>
