<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chargement de la carte…</title>
</head>
<body>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var data = params.get('data');
  if (data) {
    try {
      localStorage.setItem('mapPoints2', data);
    } catch (e) {
      console.error(e);
    }
  } else {
    try {
      var step1 = localStorage.getItem('mapPoints');
      if (step1) {
        localStorage.setItem('mapPoints2', step1);
      }
    } catch (e) {
      console.error(e);
    }
  }
  window.location.replace('index1.html');
})();
</script>
</body>
</html>
