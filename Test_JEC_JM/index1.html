<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte des besoins / biens</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }
    .popup-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
    .popup-line { margin: 4px 0; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
  var urlParams = new URLSearchParams(window.location.search);
  var pointsParam = urlParams.get('points') || urlParams.get('data');

  if (!pointsParam) {
    pointsParam = localStorage.getItem('mapPoints2') || localStorage.getItem('mapPoints');
  }

  var points = [];
  if (pointsParam) {
    try {
      var raw = pointsParam;
      if (raw.indexOf('%') !== -1) {
        try { raw = decodeURIComponent(raw); } catch (e) { /* keep raw */ }
      }
      points = JSON.parse(raw);
    } catch (err) {
      console.error('Erreur lecture JSON :', err);
    }
  }

  if (!Array.isArray(points)) {
    points = [];
  }

  points = points
    .map(function (p) {
      return {
        lat: Number(p.lat),
        lng: Number(p.lng),
        nom: p.nom || '',
        distance: p.distance != null ? Number(p.distance) : 0,
        duree: p.duree,
        periode: p.periode || '',
        nbAgents: p.nbAgents != null ? Number(p.nbAgents) : undefined,
        up: p.up || '',
        SiteITIF: p.SiteITIF || '',
        Immosis: p.Immosis || '',
        Actif: p.Actif || '',
        Effectif: p.Effectif || '',
        Superficie: p.Superficie || '',
        color: p.color
      };
    })
    .filter(function (p) {
      return Number.isFinite(p.lat) && Number.isFinite(p.lng)
        && p.lat >= -90 && p.lat <= 90
        && p.lng >= -180 && p.lng <= 180;
    });

  if (points.length === 0) {
    points = [{ lat: 48.8566, lng: 2.3522, nom: 'Aucun point transmis' }];
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getColor(p) {
    if (p.color) return p.color;
    if (p.nbAgents >= 10) return '#d73027';
    if (p.nbAgents >= 5) return '#ff9800';
    return '#2563EB';
  }

  function buildPopup(p) {
    var html = '<div class="popup-title">📍 ' + escapeHtml(p.nom || 'Point') + '</div>';

    if (p.nbAgents !== undefined && !Number.isNaN(p.nbAgents)) {
      html +=
        '<div class="popup-line"><b>📏 Rayon :</b> ' + escapeHtml(p.distance || 0) + ' km</div>' +
        '<div class="popup-line"><b>📅 Période :</b> ' + escapeHtml(p.periode) + '</div>' +
        '<div class="popup-line"><b>⏱ Durée :</b> ' + escapeHtml(p.duree) + ' jours</div>' +
        '<div class="popup-line"><b>👷 Agents :</b> ' + escapeHtml(p.nbAgents) + '</div>' +
        '<div class="popup-line"><b>🏢 UP :</b> ' + escapeHtml(p.up) + '</div>';
    }

    if (p.SiteITIF) {
      html +=
        '<div class="popup-line"><b>🏢 Site ITIF :</b> ' + escapeHtml(p.SiteITIF) + '</div>';
    }
    if (p.Immosis) {
      html += '<div class="popup-line"><b>🆔 IMMOSIS :</b> ' + escapeHtml(p.Immosis) + '</div>';
    }
    if (p.Actif) {
      html += '<div class="popup-line"><b>⚙️ Statut :</b> ' + escapeHtml(p.Actif) + '</div>';
    }
    if (p.Effectif) {
      html += '<div class="popup-line"><b>👥 Effectif :</b> ' + escapeHtml(p.Effectif) + '</div>';
    }
    if (p.Superficie) {
      html += '<div class="popup-line"><b>📐 Superficie :</b> ' + escapeHtml(p.Superficie) + ' m²</div>';
    }

    return html;
  }

  var map = L.map('map', { preferCanvas: true, zoomControl: true })
    .setView([points[0].lat, points[0].lng], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  var markers = L.markerClusterGroup({
    chunkedLoading: true,
    maxClusterRadius: 50,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true
  });

  var bounds = [];

  points.forEach(function (p) {
    var color = getColor(p);
    var icon = L.divIcon({
      className: 'custom-marker',
      html: '<div style="background:' + color + ';width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,.45);"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10],
      popupAnchor: [0, -10]
    });

    var marker = L.marker([p.lat, p.lng], { icon: icon })
      .bindPopup(buildPopup(p), { maxWidth: 360, closeButton: true });
    markers.addLayer(marker);
    bounds.push([p.lat, p.lng]);

    if (p.distance && p.distance > 0) {
      L.circle([p.lat, p.lng], {
        radius: p.distance * 1000,
        color: color,
        fillColor: color,
        fillOpacity: 0.12,
        weight: 2
      }).addTo(map);
    }
  });

  map.addLayer(markers);

  if (bounds.length === 1) {
    map.setView(bounds[0], 12);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
  }
})();
</script>
</body>
</html>
