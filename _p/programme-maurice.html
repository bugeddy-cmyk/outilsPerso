.tabs[data-a="1"] .ind{transform:translateX(100%)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px}

.res small{font-size:1rem;color:var(--muted);font-weight:500;margin-left:6px}
.pop{animation:pop .2s ease-out}
.cap{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.list{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"s n v";gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;animation:rise .35s both;animation-delay:calc(var(--i)*22ms);transition:background .2s}
